# Конфигурация контейнера зависимостей.
# Автоконфигурация и автовайринг включены: сервисы регистрируются как private,
# зависимости внедряются по типам аргументов конструктора.

parameters:
    # Базовый URL источника данных для парсера (banki.ru).
    app.parser.source_url: 'https://www.banki.ru/services/calculators/hypothec/'
    # User-Agent для HTTP-клиента парсера.
    app.parser.user_agent: 'Mozilla/5.0 (compatible; MortgageBot/1.0; +https://example.com/bot)'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            string $parserSourceUrl: '%app.parser.source_url%'
            string $parserUserAgent: '%app.parser.user_agent%'

    # Регистрируем всё из src/ как сервисы.
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Контроллеры помечаем тегом controller.service_arguments для инъекции в методы экшенов.
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # Парсеры: регистрируем адаптеры и передаём их в команду через tagged iterator
    App\Parser\AbstractProgramParser:
        tag:
            name: app.program_parser
            abstract: true

    App\Parser\Adapter\MortgageProgramParser:
        tags: [app.program_parser]

    App\Parser\Adapter\RefinanceProgramParser:
        tags: [app.program_parser]

    # Команда парсинга: получаем все парсеры через tagged iterator
    App\Command\ParseProgramsCommand:
        arguments:
            $parsers: !tagged_iterator app.program_parser
