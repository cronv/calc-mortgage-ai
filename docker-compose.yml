# Ипотечный калькулятор — единая инфраструктура.
# Все образы Alpine, единая bridge-сеть, именованные тома для данных и кэша.
# Стек: PHP 8.4-fpm-alpine, MySQL 8.4, Nginx alpine, Node 22-alpine (build-стадия фронта).

name: mortgage

services:
  # --------- MySQL 8.4 (Alpine-вариант oraclelinux недоступен, берём стабильный 8.4) ---------
  mysql:
    image: mysql:8.4
    container_name: mortgage_mysql
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --max-connections=300
      - --bind-address=0.0.0.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mortgage}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -uroot -p$${MYSQL_ROOT_PASSWORD:-root}" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [mortgage_net]

  # --------- PHP-FPM 8.4 (Symfony backend) ---------
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: mortgage_php
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      DATABASE_URL: "mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-app}@mysql:3306/${MYSQL_DATABASE:-mortgage}?serverVersion=8.4.0&charset=utf8mb4"
    volumes:
      - ./backend:/var/www/html
      - ./frontend/dist/mortgage-widget/browser:/var/www/widget/
      - php_cache:/var/www/html/var
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [mortgage_net]

  # --------- Node 22 (build Angular main-app + widget) ---------
  # Поднимается профилем build; в обычном up не запускается.
  node:
    image: node:22-alpine
    container_name: mortgage_node
    working_dir: /app
    profiles: [build]
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    command:
      - "sh"
      - "-c"
      - |
        set -e
        npm ci
        npm run build:main
        npm run build:widget
        # Стабильное имя бандла виджета для тега <script src="mortgage-widget.js">
        WIDGET_JS=$$(ls dist/mortgage-widget/browser/main-*.js dist/mortgage-widget/browser/main.js 2>/dev/null | head -n1)
        if [ -n "$$WIDGET_JS" ]; then cp "$$WIDGET_JS" dist/mortgage-widget/browser/mortgage-widget.js; fi
        # Демо-страница встраивания виджета
        cp /app/widget-demo.html dist/mortgage-widget/browser/widget-demo.html 2>/dev/null || true
        echo "Frontend build complete."
    networks: [mortgage_net]

  # --------- Nginx (reverse proxy + статика SPA + виджет + CORS) ---------
  nginx:
    image: nginx:latest
    container_name: mortgage_nginx
    depends_on:
      php:
        condition: service_started
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/api_location.conf:/etc/nginx/api_location.conf:ro
      - ./docker/nginx/server1.conf:/etc/nginx/conf.d/server1.conf:ro # s1
      - ./docker/nginx/server2.conf:/etc/nginx/conf.d/server2.conf:ro # s2
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./backend/public:/var/www/html/public:ro
      - ./frontend/dist/main-app/browser:/var/www/main:ro
      - ./frontend/dist/mortgage-widget/browser:/var/www/widget:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [mortgage_net]

networks:
  mortgage_net:
    driver: bridge

volumes:
  db_data:
  php_cache:
  node_modules:
