# Nginx config для проекта поддомен
# Версия: Nginx 1.25.1+ / 1.31+

# ========== HTTP → HTTPS редирект ==========
server {
    listen 80;
    server_name поддомен.ваш-сервер4.ru;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://$host$request_uri;
}

# ========== Основной домен: Раздача статики ==========
server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    server_name поддомен.ваш-сервер4.ru;

    ssl_certificate ssl/fullchain.pem;
    ssl_certificate_key ssl/privkey.pem;

    # Security заголовки
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Корневая папка проекта внутри контейнера
    root /var/www/поддомен;
    index index.html;

    # Обработка маршрутов SPA (отдаем index.html для всех несуществующих файлов)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Агрессивное кэширование статики (JS, CSS, картинки, шрифты)
    # Это значительно ускорит загрузку сайта для пользователей
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Обработка ошибок
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
