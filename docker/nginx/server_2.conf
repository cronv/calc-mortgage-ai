# Nginx config для проекта ваш-сервер2.ru (Node.js backend)
# Версия: Nginx 1.31+

# Upstream для Node.js сервера
upstream node_backend_ai {
    server host.docker.internal:3000;
    keepalive 64;
}

# ========== HTTP → HTTPS редирект ==========
server {
    listen 80;
    server_name ваш-сервер2.ru www.ваш-сервер2.ru;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://$host$request_uri;
}

# ========== Основной домен: проксирование всего на Node.js ==========
server {
    # HTTP/2 (TCP) + HTTP/3 (QUIC/UDP). Alt-Svc сообщает браузерам о поддержке h3.
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    server_name ваш-сервер2.ru www.ваш-сервер2.ru;

    # Пути к сертификатам
    ssl_certificate ssl/fullchain2.pem;
    ssl_certificate_key ssl/privkey2.pem;

    # Security заголовки
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- Проксирование всего трафика на Node.js ----------
    # Убраны root и index. Все запросы (включая /admin/login) уходят на Node.js
    location / {
        proxy_pass http://node_backend_ai;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Обработка ошибок
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ========== Catch-all для неизвестных доменов ==========
server {
    # HTTP/2 (TCP) + HTTP/3 (QUIC/UDP). Alt-Svc сообщает браузерам о поддержке h3.
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    server_name _;

    ssl_certificate ssl/fullchain2.pem;
    ssl_certificate_key ssl/privkey2.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 444;
}
