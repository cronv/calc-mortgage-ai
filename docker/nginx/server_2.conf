# Nginx config для проекта ваш-сервер2.ru
# Размещается в ./docker/nginx/ваш-сервер2.conf.prod

upstream php_fpm_ваш-сервер2 {
    server php-ваш-сервер2:9000;
    keepalive 32;
}

# ========== HTTP → HTTPS редирект ==========
server {
    listen 80;
    server_name ваш-сервер2.ru www.ваш-сервер2.ru;

    # HSTS preload
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://$host$request_uri;
}

# ========== Основной домен: главная страница + API ==========
server {
    listen 443 ssl;
    http2 on;
    server_name ваш-сервер2.ru www.ваш-сервер2.ru;

    # Пути к сертификатам
    ssl_certificate ~/ssl/ваш-сервер2_fullchain.pem;
    ssl_certificate_key ~/ssl/ваш-сервер2_privkey.pem;

    # Современные SSL настройки (TLS 1.2/1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security заголовки
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    root /var/www/ваш-сервер2/public;
    index index.html;

    # ---------- API → PHP-FPM (отдельный контейнер) ----------
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php_fpm_ваш-сервер2;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Скрытие версии PHP
        fastcgi_hide_header X-Powered-By;

        internal;
    }

    # ---------- Статика SPA с длинным кэшем ----------
    location ~* \.(?:js|css|woff2|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---------- SPA fallback ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ========== Catch-all для неизвестных доменов → редирект на основной ==========
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate ~/ssl/fullchain.pem;
    ssl_certificate_key ~/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://$host$request_uri;
}
