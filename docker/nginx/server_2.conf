# Nginx config для проекта ваш-сервер2.ru (Angular + Node.js)
# Версия: Nginx 1.31+

# Upstream для Node.js сервера
# Замените 'node-ваш-сервер2' на имя сервиса в docker-compose.yml
# Замените '3000' на порт, который слушает ваше Node.js приложение
upstream node_backend_ai {
    server host.docker.internal:3000;
    keepalive 64;
}

# ========== HTTP → HTTPS редирект ==========
server {
    listen 80;
    server_name ваш-сервер2.ru www.ваш-сервер2.ru;

    # HSTS preload header сразу на http (опционально, но полезно)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://$host$request_uri;
}

# ========== Основной домен: Angular (SPA) + Node.js API ==========
server {
    listen 443 ssl;
    http2 on;
    server_name ваш-сервер2.ru www.ваш-сервер2.ru;

    # Пути к сертификатам (абсолютные пути внутри контейнера nginx)
    ssl_certificate ssl/fullchain2.pem;
    ssl_certificate_key ssl/privkey2.pem;

    # Современные SSL настройки (TLS 1.2/1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    # Актуальный набор шифров для высокой совместимости и безопасности
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security заголовки
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Для SPA важно разрешать рефереры внутри домена
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Корень сайта со статикой Angular
    root /var/www/ваш-сервер2/public;
    index index.html;

    # ---------- API → Node.js Proxy ----------
    # Все запросы к /api перенаправляются на Node.js сервер
    location /api/ {
        proxy_pass http://node_backend_ai;

        # Необходимые заголовки для проксирования
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Поддержка WebSocket (если нужно)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Таймауты (увеличьте если есть долгие запросы)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Если API находится не по префиксу /api, а, например, в отдельном location:
    # location = /graphql { ... } или location ~ ^/users { ... }

    # ---------- Статика SPA (Angular build) ----------
    # Кэширование ассетов с хешами в имени
    location ~* \.(?:js|css|woff2|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---------- HTML файлы (без кэша или короткий кэш) ----------
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---------- SPA Fallback (Angular Routing) ----------
    # Если файл не найден, отдаем index.html, чтобы роутинг отработал на клиенте
    location / {
        try_files $uri $uri/ /index.html;

        # Важно: если index.html не найден (совсем пустая папка), можно вернуть ошибку или редирект
        # Но обычно try_files справляется.
    }

    # Обработка ошибок (опционально)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ========== Catch-all для неизвестных доменов ==========
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Используем дефолтный сертификат или сертификат основного домена
    ssl_certificate ssl/fullchain2.pem;
    ssl_certificate_key ssl/privkey2.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Либо возвращаем 444 (разрыв соединения), либо редирект на основной домен
    return 444;
    # Или: return 301 https://ваш-сервер2.ru$request_uri;
}
