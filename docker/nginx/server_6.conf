# server_6.conf — food-sites (проект A) за edge-nginx проекта B.
# Здесь только транспорт: TLS, HTTP/2+HTTP/3, HSTS, редирект с :80, лимиты тела.
# Весь прикладной роутинг (Symfony-роуты, SSR, /storage/, CSP, админка) —
# в собственном nginx проекта A (foodguru-web). Не дублировать его здесь.
#
# ВАЖНО: не включать сюда api_location.conf — он уведёт /api/ на php:9000 ипотеки.

# ========== HTTP → HTTPS ==========
server {
    listen 80;
    server_name food-sites.ru www.food-sites.ru api.food-sites.ru admin.food-sites.ru;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://$host$request_uri;
}

# ========== Витрина (SSR) + админка (SPA) ==========
server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    server_name food-sites.ru www.food-sites.ru admin.food-sites.ru;

    # Один SAN-сертификат на все 4 имени (или wildcard *.food-sites.ru + apex).
    # Имя fullchain6/privkey6 попадает под существующий .gitignore docker/.
    ssl_certificate     ssl/fullchain6.pem;
    ssl_certificate_key ssl/privkey6.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Прикладные заголовки (nosniff, X-Frame-Options, CSP…) приходят от nginx A —
    # здесь их не добавляем и не затираем: на уровне location своих add_header нет.

    # Резолв через встроенный DNS Docker в рантайме, а не на старте:
    # если стек A лежит, nginx B всё равно стартует и обслуживает остальные 5 сайтов
    # (этот вернёт 502). С upstream-блоком нерезолвнувшийся DNS роняет весь nginx.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $foodguru_backend http://foodguru-web:80;

    location / {
        proxy_pass $foodguru_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ========== API: загрузки до 100 МБ (видеоработы конкурсов) ==========
server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    server_name api.food-sites.ru;

    ssl_certificate     ssl/fullchain6.pem;
    ssl_certificate_key ssl/privkey6.pem;

    # Перебиваем http-level «client_max_body_size 8m» из nginx.conf B,
    # иначе загрузка рилса/видео умрёт на edge с 413, не дойдя до A.
    client_max_body_size 110m;
    client_body_timeout  300s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $foodguru_backend http://foodguru-web:80;

    location / {
        proxy_pass $foodguru_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # nginx A пробрасывает это в Symfony как fastcgi_param HTTPS —
        # cookie_secure: auto заработает, вход по HTTPS не сломается.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
